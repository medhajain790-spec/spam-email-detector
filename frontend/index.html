<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Email Detector</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>📧 Spam Email Detector</h1>

        <textarea id="emailInput" placeholder="Paste your email here..."></textarea>

        <button id="checkBtn">Check Email</button>

        <div id="result" class="result hidden">

            <p id="prediction" class="prediction"></p>
            <p id="confidence" class="confidence"></p>
            <p id="note" class="note"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
